- path: XKeyIM/README.md
  snippet: "# XKeyIM - Input Method Kit Vietnamese\n\nXKeyIM là Input Method sử dụng\
    \ Input Method Kit (IMKit) của Apple, cung cấp trải nghiệm gõ tiếng Việt mượt\
    \ mà hơn trong Terminal và IDE.\n\n## Ưu điểm so với CGEvent injection\n\n| Aspect\
    \ | CGEvent (XKey) | IMKit (XKeyIM) |\n|--------|----------------|----------------|\n\
    | Flickering | Có thể xảy ra | Không có |\n| Terminal support | Cần tune timing\
    \ | Native support |\n| Setup | Không cần | Cần enable trong System Settings |\n\
    \n## Bundle Identifiers\n\n| Component | Bundle ID |\n|-----------|-----------|\n\
    | XKey (main app) | `com.codetay.XKey` |\n| XKeyIM (input method) | `com.codetay.inputmethod.XKey`\
    \ |\n| App Group | `group.com.codetay.xkey` |\n\n> **Lưu ý:** Bundle ID của Input\
    \ Method cần có format `*.inputmethod.*` để macOS nhận diện đúng.\n\n## Cài đặt\n\
    \n### Cách 1: Từ XKey Settings\n1. Mở XKey Settings → Nâng cao\n2. Bật \"IMKit\
    \ Mode\"\n3. Click \"Cài đặt XKeyIM...\"\n4. Làm theo hướng dẫn để copy XKeyIM.app\
    \ vào `~/Library/Input Methods/`\n\n### Cách 2: Manual\n1. Build XKeyIM target\
    \ trong Xcode\n2. Copy `XKeyIM.app` vào `~/Library/Input Methods/`\n3. Logout/Login\
    \ lại\n4. Mở System Settings → Keyboard → Input Sources\n5. Click \"+\" và thêm\
    \ \"XKey Vietnamese\"\n\n## Cấu trúc Project\n\n```\nXKeyIM/\n├── Info.plist \
    \                 # IMKit configuration\n├── XKeyIM.entitlements         # Entitlements\
    \ for debug build\n├── XKeyIMRelease.entitlements  # Entitlements for release\
    \ build\n├── main.swift                  # Entry point\n├── XKeyIMController.swift\
    \      # IMKInputController subclass\n├── en.lproj/\n│   └── InfoPlist.strings\
    \       # English localization\n├── vi.lproj/\n│   └── InfoPlist.strings     \
    \  # Vietnamese localization\n└── README.md                   # This file\n```\n\
    \n## Build Instructions\n\n### Bước 1: Tạo XKeyIM Target trong Xcode\n\n1. Mở\
    \ `XKey.xcodeproj` trong Xcode\n2. File → New → Target...\n3. Chọn **macOS** →\
    \ **App** → Next\n4. Cấu hình:\n   - Product Name: `XKeyIM`\n   - Bundle Identifier:\
    \ `com.codetay.inputmethod.XKey`\n   - Language: Swift\n   - User Interface: None\n\
    5. Click **Finish**\n\n### Bước 2: Cấu hình Target Settings\n\n1. Chọn **XKeyIM\
    \ target** trong Project Navigator\n\n2. Tab **General**:\n   - Bundle Identifier:\
    \ `com.codetay.inputmethod.XKey`\n   - Minimum Deployments: macOS 12.0+\n\n3.\
    \ Tab **Build Settings**:\n   - **Info.plist File** = `XKeyIM/Info.plist`\n  \
    \ - **Code Signing Entitlements** = `XKeyIM/XKeyIMRelease.entitlements` (cho Release)\n\
    \n4. Tab **Signing & Capabilities**:\n   - Chọn Team\n   - Click **+ Capability**\
    \ → Thêm **App Groups**\n   - Chọn `group.com.codetay.inputmethod.XKey`\n\n###\
    \ Bước 3: Setup App Group trong Apple Developer Portal\n\n1. Đăng nhập https://developer.apple.com\n\
    2. Certificates, Identifiers & Profiles → Identifiers\n\n**Tạo App Group (nếu\
    \ chưa có):**\n1. Click \"+\" → App Groups\n2. Description: `XKey Shared Settings`\n\
    3. Identifier: `group.com.codetay.inputmethod.XKey`\n\n**Tạo App ID cho XKeyIM:**\n\
    1. Click \"+\" → App IDs → App\n2. Platform: macOS\n3. Description: `XKey Input\
    \ Method`\n4. Bundle ID: `com.codetay.inputmethod.XKey`\n5. Capabilities: ✅ App\
    \ Groups\n6. Chọn `group.com.codetay.inputmethod.XKey`\n\n**Tạo Provisioning Profile:**\n\
    1. Profiles → Click \"+\"\n2. Chọn \"macOS App Development\" hoặc \"Developer\
    \ ID Application\"\n3. Chọn App ID: `com.codetay.inputmethod.XKey`\n4. Chọn certificate\
    \ và devices\n5. Download và double-click để install\n\n### Bước 4: Thêm Source\
    \ Files vào Target\n\nXKeyIM cần dùng chung code engine với XKey. Trong Xcode:\n\
    \n1. Chọn các file trong **Project Navigator**\n2. Mở **File Inspector** (panel\
    \ bên phải)\n3. Trong section **Target Membership**, check ✅ **XKeyIM**\n\n**Các\
    \ file cần check Target Membership:**\n```\nXKey/Core/Engine/\n├── VNEngine.swift\
    \           ✅\n├── VNCharacter.swift        ✅\n├── SpellChecker.swift       ✅\n\
    └── ... (các file engine khác)\n\nXKey/Core/Models/\n├── InputMethod.swift   \
    \     ✅\n├── CodeTable.swift          ✅\n└── ... (các model cần thiết)\n```\n\n\
    ### Bước 5: Build\n\n**Sử dụng build script:**\n```bash\ncd XKey\n./build_release.sh\n\
    ```\n\n**Hoặc build thủ công:**\n```bash\nxcodebuild -project XKey.xcodeproj \\\
    \n  -scheme XKeyIM \\\n  -configuration Release \\\n  build\n```\n\n### Bước 6:\
    \ Install\n\n```bash\n# Copy vào Input Methods\ncp -R Release/XKeyIM.app ~/Library/Input\\\
    \ Methods/\n\n# Logout/Login để macOS nhận diện\n```\n\n### Bước 7: Enable Input\
