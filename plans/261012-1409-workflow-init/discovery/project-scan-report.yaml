analysis:
  provider: claude
  run_id: 5baf0b62-3b80-4abb-841c-b49c6d9ffcee
  purpose_summary: 'XKey is a native macOS Vietnamese typing method (Telex, VNI, Simple
    Telex, auto-detect) that replaces unmaintained or incompatible Vietnamese IMEs
    on recent macOS (12+). It converts keystrokes into Vietnamese characters in any
    app. It adds productivity features: macros, quick typing, spell-check with personal
    dictionary, per-app smart switch, text conversion tools (case, code table, strip
    diacritics), and hotkey translation. It runs locally and collects no user data.
    This repo looks like a fork or personal checkout (git user LuffyTran) of the upstream
    xmannv/xkey project.'
  purpose_confidence: 0.93
  architecture_overview: 'Xcode project (XKey.xcodeproj, Swift, SwiftUI plus AppKit)
    with two runtime surfaces. (1) XKey: a menu-bar app that installs a CGEvent tap
    and injects replacement keystrokes or text into the focused app. It uses the Accessibility
    API and has special handling for app quirks (Spotlight, Raycast, terminals, browsers).
    (2) XKeyIM: an experimental Input Method Kit (IMKInputController) bundle installed
    in ~/Library/Input Methods, with a different bundle id (com.codetay.inputmethod.XKey).
    It gives flicker-free composition and shares the engine code. A third layer, Shared/,
    is compiled into both targets. It holds the input session and app-policy runtime
    (Shared/InputSession), AX helpers, app behavior detection, tap environment/event
    source, debug logging and translation languages. XKey/Core/Engine holds the Vietnamese
    engine (VNEngine, spell checker, ConvertTool, code tables). XKey/EventHandling
    holds the injection strategies. XKey/UI holds the SwiftUI settings, convert-tool
    and debug windows. XKey/Utilities and XKey/App (AppDelegate) cover lifecycle and
    helpers. Integrations: macOS Accessibility, Input Monitoring, Services menu, global
    hotkeys, App Group shared settings, online translation providers (Google, Tencent,
    Volcano), auto-update and Homebrew cask distribution, and a bundled GPL Vietnamese
    dictionary. Versioning lives in Version.xcconfig. build_release.sh packages releases.
    XKeyTests holds unit tests. The docs, plans and superpowers folders hold workflow
    and design notes, not runtime code.'
