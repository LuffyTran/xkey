- path: README.md
  snippet: "# XKey\n\n<div align=\"center\">\n  <img src=\"xkey.png\" alt=\"XKey Logo\"\
    \ width=\"128\" height=\"128\">\n\n  **Bộ gõ tiếng Việt hiện đại cho macOS**\n\
    \n  [![Version](https://img.shields.io/badge/dynamic/regex?url=https%3A%2F%2Fraw.githubusercontent.com%2Fxmannv%2Fxkey%2Frefs%2Fheads%2Fmain%2FVersion.xcconfig&search=MARKETING_VERSION%5Cs%2A%3D%5Cs%2A%28%5B0-9.%5D%2B%29&replace=%241&label=version)](https://github.com/xmannv/xkey/releases)\n\
    \  [![Homebrew Cask](https://img.shields.io/homebrew/cask/v/xkey?label=homebrew%20cask)](https://formulae.brew.sh/cask/xkey)\n\
    \  [![macOS](https://img.shields.io/badge/macOS-12.0+-green.svg)](https://www.apple.com/macos/)\n\
    \  [![License](https://img.shields.io/badge/license-MIT-blue.svg)](LICENSE)\n\
    </div>\n\n---\n\n#### (Chọn ngôn ngữ dưới đây / Choose your language below)\n\
    [![Tiếng Việt](https://img.shields.io/badge/Language-Ti%E1%BA%BFng_Vi%E1%BB%87t-red)](README.md)\n\
    [![English](https://img.shields.io/badge/Language-English-green)](README.en.md)\n\
    \n---\n\n## Giới thiệu\n\n### Tại sao XKey ra đời?\n\nCác bộ gõ tiếng Việt hiện\
    \ có trên macOS thường gặp một số vấn đề:\n\n- Không tương thích với các phiên\
    \ bản macOS mới nhất\n- Còn nhiều lỗi chưa được sửa, ít được cập nhật và bảo trì\n\
    - Thiếu tính năng hiện đại, khó debug và tùy biến\n\nXKey được xây dựng để giải\
    \ quyết những vấn đề này.\n\n### Điểm nổi bật\n\n- Hiệu suất cao: viết hoàn toàn\
    \ bằng Swift native, tối ưu cho macOS\n- Tương thích tốt với các phiên bản macOS\
    \ mới (12.0+)\n- Ổn định và cập nhật thường xuyên, có auto-update\n- Debug Window\
    \ để theo dõi hoạt động của bộ gõ theo thời gian thực\n- Các tính năng thông minh:\
    \ Smart Switch, Macro, Quick Typing, kiểm tra chính tả, từ điển cá nhân\n- Dịch\
    \ thuật nhanh bằng phím tắt, hỗ trợ hơn 30 ngôn ngữ qua nhiều nhà cung cấp (Google,\
    \ Tencent, Volcano)\n- Giao diện hiện đại xây dựng bằng SwiftUI\n- Chạy hoàn toàn\
    \ cục bộ, không thu thập dữ liệu người dùng\n- Hai chế độ hoạt động: CGEvent và\
    \ Input Method Kit (XKeyIM)\n\n---\n\n## Tính năng chính\n\n<div align=\"center\"\
    >\n  <img src=\"xkey-panel.png\" alt=\"XKey Settings Panel\" width=\"800\">\n\
    </div>\n\n### 1. Hai chế độ hoạt động\n\n| Chế độ | Mô tả | Ưu điểm |\n|--------|-------|---------|\n\
    | **CGEvent** (mặc định) | Dùng CGEvent injection | Không cần cấu hình, hoạt động\
    \ ngay với mọi app |\n| **XKeyIM** (thử nghiệm) | Dùng Input Method Kit | Mượt\
    \ hơn trong Terminal, Spotlight, Address Bar |\n\n### 2. Hỗ trợ đa kiểu gõ\n\n\
    | Kiểu gõ | Mô tả | Ví dụ |\n|---------|-------|-------|\n| **Tự nhận kiểu gõ**\
    \ | Tự nhận diện Telex hoặc VNI khi gõ | — |\n| **Telex** | Kiểu gõ phổ biến nhất\
    \ | `tieengs` → tiếng |\n| **VNI** | Kiểu gõ truyền thống dùng số | `tie61ng`\
    \ → tiếng |\n| **Simple Telex 1** | Telex đơn giản (w không biến đổi) | `tieengs`\
    \ → tiếng |\n| **Simple Telex 2** | Telex + w cho ư/ơ | `tuaw` → tưa |\n\n###\
    \ 3. Bảng mã\n\n- **Unicode (UTF-8)** — khuyến nghị, mặc định\n- **TCVN3 (ABC)**\
    \ — tương thích phần mềm cũ\n- **VNI Windows** — tương thích font VNI\n\n### 4.\
    \ Gõ nhanh\n\nTăng tốc độ gõ bằng các phím tắt thông minh.\n\n| Tính năng | Chức\
    \ năng |\n|-----------|-----------|\n| **Quick Telex** | `cc`→`ch`, `gg`→`gi`,\
    \ `kk`→`kh`, `nn`→`ng`, `pp`→`ph`, `qq`→`qu`, `tt`→`th` |\n| **Quick Start Consonant**\
    \ | `f`→`ph`, `j`→`gi`, `w`→`qu` (đầu từ) |\n| **Quick End Consonant** | `g`→`ng`,\
    \ `h`→`nh`, `k`→`ch` (cuối từ) |\n\n### 5. Macro (thay thế văn bản)\n\nTự động\
    \ thay thế văn bản bằng Macro:\n\n- Tạo các từ viết tắt tùy chỉnh\n- Import/export\
    \ danh sách macro (.txt)\n- Tùy chọn tự động viết hoa macro\n- Tùy chọn thêm khoảng\
    \ trắng sau macro\n- Dùng được cả trong chế độ tiếng Anh\n\n### 6. Công cụ chuyển\
    \ đổi văn bản\n\nTruy cập nhanh bằng phím tắt tùy chỉnh.\n\n| Tính năng | Mô tả\
    \ |\n|-----------|-------|\n| **Chữ hoa/thường** | Viết hoa tất cả, viết thường\
    \ tất cả, viết hoa chữ đầu, viết hoa mỗi từ |\n| **Bảng mã** | Chuyển đổi Unicode\
    \ ↔ TCVN3 ↔ VNI |\n| **Xóa dấu** | Chuyển từ có dấu sang không dấu |\n\n### 7.\
    \ Kiểm tra chính tả (thử nghiệm)\n\n- Dùng từ điển tiếng Việt (~200KB, giấy phép\
    \ GPL)\n- Tự động khôi phục khi gõ sai chính tả\n- Hỗ trợ cả dấu mới (xoà) và\
    \ dấu cũ (xóa)\n- Từ điển cá nhân: thêm từ riêng để bỏ qua kiểm tra\n- Import/export\
    \ từ điển cá nhân\n\n### 8. Smart Switch\n\n- Nhớ ngôn ngữ theo từng ứng dụng\n\
    - Hỗ trợ phát hiện các app overlay như Spotlight/Raycast/Alfred\n- Tự động chuyển\
    \ ngôn ngữ khi chuyển app\n\n### 9. Dịch thuật nhanh\n\nDịch văn bản ngay trong\
    \ mọi ứng dụng bằng phím tắt tùy chỉnh. XKey cung cấp hai hướng dịch, mỗi hướng\
    \ có phím tắt riêng và các tùy chọn hoạt động độc lập.\n\n#### Dịch sang ngôn\
    \ ngữ đích\n\nDịch văn bản đang chọn (hoặc toàn bộ nội dung) từ ngôn ngữ nguồn\
    \ sang ngôn ngữ đích.\n\nCách dùng:\n1. Chọn (bôi đen) text cần dịch trong bất\
    \ kỳ ứng dụng nào\n2. Nhấn phím tắt (mặc định: `⌘ + ⇧ + T`)\n3. Kết quả được xử\
    \ lý theo các tùy chọn đã bật\n\nNếu không chọn text, XKey sẽ dịch toàn bộ nội\
    \ dung trong ô nhập liệu.\n\n| Tùy chọn | Mặc định | Mô tả |\n|----------|----------|-------|\n\
    | **Thay thế text gốc** | Bật | Thay thế text đang chọn bằng bản dịch |\n| **Copy\
    \ vào clipboard** | Bật | Copy bản dịch vào clipboard |\n| **Hiển thị popup**\
    \ | Tắt | Hiển thị bản"
